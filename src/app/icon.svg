<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 72" fill="none">
  <!-- S bezier curve -->
  <path d="M 38,14 C 52,10 52,30 28,34 C 4,38 4,58 18,62"
        stroke="#C9A9C7" stroke-width="2" stroke-linecap="round"/>

  <!-- Inner handle lines -->
  <line x1="28" y1="34" x2="52" y2="30" stroke="rgba(201,169,199,0.22)" stroke-width="0.7"/>
  <line x1="28" y1="34" x2="4"  y2="38" stroke="rgba(201,169,199,0.22)" stroke-width="0.7"/>

  <!-- Outer handle lines (dashed) -->
  <line x1="38" y1="14" x2="52" y2="10" stroke="rgba(201,169,199,0.45)" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="18" y1="62" x2="4"  y2="62" stroke="rgba(201,169,199,0.45)" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Inner handle dots -->
  <circle cx="52" cy="30" r="1.8" fill="rgba(201,169,199,0.5)"/>
  <circle cx="4"  cy="38" r="1.8" fill="rgba(201,169,199,0.5)"/>

  <!-- Outer handle dots -->
  <circle cx="52" cy="10" r="2.5" fill="#C9A9C7"/>
  <circle cx="4"  cy="62" r="2.5" fill="#C9A9C7"/>

  <!-- Start anchor square -->
  <rect x="34" y="10" width="8" height="8" rx="1.5" fill="#F4EFE6" stroke="#C9A9C7" stroke-width="1.5"/>

  <!-- End anchor square -->
  <rect x="14" y="58" width="8" height="8" rx="1.5" fill="#F4EFE6" stroke="#C9A9C7" stroke-width="1.5"/>
</svg>
