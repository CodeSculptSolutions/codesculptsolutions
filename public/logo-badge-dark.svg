<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" rx="56" fill="#1B1A1F"/>

  <!-- Mark centered: 56×72 scaled to ~179×230, offset (111, 85) -->
  <g transform="translate(111, 85) scale(3.2)">
    <!-- S bezier curve -->
    <path d="M 38,14 C 52,10 52,30 28,34 C 4,38 4,58 18,62"
          stroke="#C9A9C7" stroke-width="2" stroke-linecap="round"
          vector-effect="non-scaling-stroke"/>

    <!-- Inner handle lines -->
    <line x1="28" y1="34" x2="52" y2="30" stroke="rgba(201,169,199,0.22)" stroke-width="0.7" vector-effect="non-scaling-stroke"/>
    <line x1="28" y1="34" x2="4"  y2="38" stroke="rgba(201,169,199,0.22)" stroke-width="0.7" vector-effect="non-scaling-stroke"/>

    <!-- Outer handle lines (dashed) -->
    <line x1="38" y1="14" x2="52" y2="10" stroke="rgba(201,169,199,0.45)" stroke-width="0.8" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>
    <line x1="18" y1="62" x2="4"  y2="62" stroke="rgba(201,169,199,0.45)" stroke-width="0.8" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>

    <!-- Inner handle dots -->
    <circle cx="52" cy="30" r="1.8" fill="rgba(201,169,199,0.5)"/>
    <circle cx="4"  cy="38" r="1.8" fill="rgba(201,169,199,0.5)"/>

    <!-- Outer handle dots -->
    <circle cx="52" cy="10" r="2.5" fill="#C9A9C7"/>
    <circle cx="4"  cy="62" r="2.5" fill="#C9A9C7"/>

    <!-- Start anchor square (fill matches dark bg) -->
    <rect x="34" y="10" width="8" height="8" rx="1.5" fill="#1B1A1F" stroke="#C9A9C7" stroke-width="1.5" vector-effect="non-scaling-stroke"/>

    <!-- End anchor square -->
    <rect x="14" y="58" width="8" height="8" rx="1.5" fill="#1B1A1F" stroke="#C9A9C7" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
