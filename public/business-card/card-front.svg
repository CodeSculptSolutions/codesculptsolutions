<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="350" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;display=swap');
      @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&amp;f[]=fraunces@400i&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="350" height="200" fill="#F4EFE6"/>

  <!-- Left clay accent strip -->
  <rect x="0" y="0" width="5" height="200" fill="#C9A9C7"/>

  <!-- ── Header: logo mark + studio name ── -->
  <g transform="translate(22, 15) scale(0.35)" fill="none">
    <path d="M 38,14 C 52,10 52,30 28,34 C 4,38 4,58 18,62"
      stroke="#C9A9C7" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="34" x2="52" y2="30" stroke="rgba(201,169,199,0.22)" stroke-width="0.7"/>
    <line x1="28" y1="34" x2="4"  y2="38" stroke="rgba(201,169,199,0.22)" stroke-width="0.7"/>
    <line x1="38" y1="14" x2="52" y2="10" stroke="rgba(201,169,199,0.45)" stroke-width="0.8" stroke-dasharray="2 2"/>
    <line x1="18" y1="62" x2="4"  y2="62" stroke="rgba(201,169,199,0.45)" stroke-width="0.8" stroke-dasharray="2 2"/>
    <circle cx="52" cy="30" r="1.8" fill="rgba(201,169,199,0.5)"/>
    <circle cx="4"  cy="38" r="1.8" fill="rgba(201,169,199,0.5)"/>
    <circle cx="52" cy="10" r="2.5" fill="#C9A9C7"/>
    <circle cx="4"  cy="62" r="2.5" fill="#C9A9C7"/>
    <rect x="34" y="10" width="8" height="8" rx="1.5" fill="#F4EFE6" stroke="#C9A9C7" stroke-width="1.5"/>
    <rect x="14" y="58" width="8" height="8" rx="1.5" fill="#F4EFE6" stroke="#C9A9C7" stroke-width="1.5"/>
  </g>

  <text x="48" y="33"
    font-family="'General Sans', system-ui, sans-serif"
    font-weight="600" font-size="12.5" fill="#1B1A1F" letter-spacing="-0.2">CodeSculptSolutions</text>

  <!-- Thin divider -->
  <line x1="22" y1="52" x2="328" y2="52" stroke="#1B1A1F" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- ── Name ── -->
  <text x="22" y="110"
    font-family="'General Sans', system-ui, sans-serif"
    font-weight="700" font-size="22" fill="#1B1A1F" letter-spacing="-0.6">Jake Lourence A. Villar</text>

  <text x="22" y="127"
    font-family="'JetBrains Mono', monospace"
    font-size="8.5" fill="#C9A9C7" letter-spacing="1.5">FOUNDER · LEAD DEVELOPER</text>

  <!-- Thin divider -->
  <line x1="22" y1="150" x2="328" y2="150" stroke="#1B1A1F" stroke-width="0.5" stroke-opacity="0.08"/>

  <!-- ── Tagline ── -->
  <text x="22" y="171"
    font-family="'Fraunces', Georgia, serif"
    font-style="italic" font-size="13" fill="#4A4751" opacity="0.6">Built with Code. Crafted with Purpose.</text>

</svg>
