    <!-- Studio label — JetBrains Mono -->
    <text x="981" y="274"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="10" letter-spacing="0.6"
          fill="#C9A9C7" opacity="0.5">Est. 2022 — Cebu, PH</text>

