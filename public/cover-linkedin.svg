  <!-- ─── Zone Separator ───────────────────────────────────── -->
  <line x1="690" y1="60" x2="690" y2="336"
        stroke="#C9A9C7" stroke-width="0.5" stroke-opacity="0.10"/>

  <!-- ─── Right: Brand Text ────────────────────────────────── -->
  <g id="right-text">

    <!-- Logo mark (scale 1.25×, dark-mode fills) -->
